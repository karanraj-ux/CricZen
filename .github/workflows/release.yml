name: Android Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore release keystore
        env:
          CRICZEN_KEYSTORE_BASE64: ${{ secrets.CRICZEN_KEYSTORE_BASE64 }}
        run: |
          echo "$CRICZEN_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/criczen-release.keystore"

      - name: Build Release APK
        env:
          CRICZEN_KEYSTORE_PATH: ${{ github.workspace }}/criczen-release.keystore
          CRICZEN_KEYSTORE_PASSWORD: ${{ secrets.CRICZEN_KEYSTORE_PASSWORD }}
          CRICZEN_KEY_ALIAS: ${{ secrets.CRICZEN_KEY_ALIAS }}
          CRICZEN_KEY_PASSWORD: ${{ secrets.CRICZEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/release/app-release.apk "criczen-${TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: criczen-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
